services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dnd-app
    restart: unless-stopped
    volumes:
      - .:/var/www
      - /var/www/vendor
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    networks:
      - dnd-network

  nginx:
    image: nginx:alpine
    container_name: dnd-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - dnd-network

  mysql:
    image: mysql:8.0
    container_name: dnd-mysql
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: dnd_attention
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dnd-network

  redis:
    image: redis:alpine
    container_name: dnd-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - dnd-network

volumes:
  mysql-data:
  redis-data:

networks:
  dnd-network:
    driver: bridge
